name: release
on:
  workflow_dispatch: # Validate/package without publishing a release or image.
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'hdhdev-droid/artex-community'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate community release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          declared="$(tr -d '\r\n' < version/VERSION)"
          RELEASE_TAG="${RELEASE_TAG:-v${declared}}"
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Community releases require a stable vMAJOR.MINOR.PATCH tag."
            exit 1
          fi
          test "$RELEASE_TAG" = "v${declared}"
          test -s "docs/releases/${RELEASE_TAG}.md"
          python3 -m json.tool version/upstream.json > /dev/null
          echo "version=${declared}" >> "$GITHUB_OUTPUT"

  backend:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: artex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex -d artex_test"
          --health-interval 3s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Offline integration and update recovery tests
        env:
          ARTEX_CONFIG: /tmp/artex-ci-no-config.json
          ARTEX_LANG: ko
          PGPASSWORD: disposable-ci-only
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts -p test_migrate_docker_auth.py
          status=0
          go test -count=1 ./defenseeval ./investigation ./securitysource ./closedloop ./offensivereview ./report ./notify ./internal/l10n ./internal/chatgpt ./llmpool ./selfupdate > /tmp/backend-tests.log 2>&1 || status=1
          go test -race ./internal/chatgpt >> /tmp/backend-tests.log 2>&1 || status=1
          for package in db agent server; do
            createdb -h localhost -U artex "artex_test_${package}"
            ARTEX_PG_DSN="postgres://artex:disposable-ci-only@localhost:5432/artex_test_${package}?sslmode=disable" \
              go test -count=1 "./${package}" >> /tmp/backend-tests.log 2>&1 || status=1
          done
          # Auth fixtures can log temporary setup tokens; never publish raw logs.
          grep -E '^(ok[[:space:]]|FAIL|--- FAIL:|\?[[:space:]])' /tmp/backend-tests.log || true
          exit "$status"

  # ① 프런트엔드 정적 내보내기(한 번 수행), 산출물을 각 플랫폼 크로스 컴파일에서 재사용
  frontend:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run test -- --run
        working-directory: web
      - run: npm run check:i18n
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② 5개 플랫폼 크로스 컴파일(프런트엔드 내장) + zip 패키징
  binaries:
    needs: [validate, frontend, backend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: v${{ needs.validate.outputs.version }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 자가 압축 해제 ELF 는 일부 Linux 커널·가상화·보안 정책에서 크래시가 난다.
          # Release 는 Go linker 스트립과 zip 압축을 사용해 이식성을 우선 보장한다.
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          RELEASE_TAG: v${{ needs.validate.outputs.version }}
        run: |
          dist/artex-linux-amd64/artex -h
          test "$(dist/artex-linux-amd64/artex -version)" = "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Linux 원본 바이너리를 따로 업로드해 docker job 에서 재사용한다(이미지 안에서 프런트엔드+Go 를 다시 빌드하지 않도록)
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ 모든 zip 을 모아 → GitHub Release 생성
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: ARTEX Community ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*.zip
            dist/SHA256SUMS
            version/VERSION
            version/upstream.json
          fail_on_unmatched_files: true

  # ④ 다중 아키텍처 이미지 → GitHub Container Registry(ghcr.io) 에 push(binaries 가 빌드한 Linux 바이너리를
  #    재사용하고, 이미지에는 도구만 설치 + 바이너리만 배치; arm64 는 apt 계층만 에뮬레이션하면 되어 빌드가 훨씬 빠르다)
  #    로그인은 워크플로 기본 GITHUB_TOKEN 으로 하므로 별도 시크릿이 필요 없다. 상류 autumn27/artex(Docker Hub)는
  #    내려갔고 이 포크는 그 네임스페이스에 push 권한도 없어, 이 포크 소유의 ghcr 네임스페이스로 발행한다.
  docker:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAMESPACE: ghcr.io/hdhdev-droid/artex-community
    steps:
      - uses: actions/checkout@v4 # Dockerfile 과 skills/ 를 가져온다
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAMESPACE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
